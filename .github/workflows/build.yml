name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute bit to wrapper
        run: chmod +x gradlew

      # Use the Android SDK already preinstalled on the runner ($ANDROID_HOME,
      # licenses pre-accepted). No sdkmanager step — it hangs on y/N prompts.
      - name: Verify preinstalled SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3 && ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTMicFix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
